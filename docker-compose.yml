# ─────────────────────────────────────────────────────────
# Sakura docker-compose.yml
# 服务编排：仅包含 backend (供本地 Electron 客户端连接)
#
# 注意：该配置假设 MySQL 数据库已在宿主机运行 (默认: localhost:3306)
#
# 使用方式：
#   docker compose up -d          # 启动后端服务
#   docker compose down           # 停止服务
#   docker compose logs -f backend # 查看日志
# ─────────────────────────────────────────────────────────

services:

  # ── FastAPI 后端 ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+aiomysql://root:YaeSakura@host.docker.internal:3306/sakura_db"
      MEMORY_STORE_DIR: "/memory_store"
      VECTOR_STORE_DIR: "/memory_store/vectors"
    volumes:
      - memory_store:/memory_store
      - ./backend/src/logs:/app/logs
    ports:
      - "0.0.0.0:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sakura_net

# ── 持久化卷 ─────────────────────────────────────────────
volumes:
  memory_store:
    name: sakura_memory_store

# ── 内部网络 ─────────────────────────────────────────────
networks:
  sakura_net:
    name: sakura_network
    driver: bridge