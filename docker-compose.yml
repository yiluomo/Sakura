# ─────────────────────────────────────────────────────────
# Sakura docker-compose.yml
# 服务编排：mysql + qdrant + backend + frontend
#
# 使用方式：
#   docker compose up -d          # 启动全部服务
#   docker compose down           # 停止并移除容器
#   docker compose logs -f        # 查看实时日志
#   docker compose logs backend   # 只看后端日志
# ─────────────────────────────────────────────────────────

services:

  # ── MySQL 数据库 ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sakura_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: YaeSakura
      MYSQL_DATABASE: sakura_db
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYaeSakura"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sakura_net


  # ── FastAPI 后端 ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+aiomysql://root:YaeSakura@mysql:3306/sakura_db"
      MEMORY_STORE_DIR: "/memory_store"
      VECTOR_STORE_DIR: "/memory_store/vectors"
    volumes:
      - memory_store:/memory_store
      - ./backend/src/logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sakura_net


  # ── Vue3 前端 + Nginx ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakura_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sakura_net


# ── 持久化卷 ─────────────────────────────────────────────
volumes:
  mysql_data:
    name: sakura_mysql_data
  memory_store:
    name: sakura_memory_store


# ── 内部网络 ─────────────────────────────────────────────
networks:
  sakura_net:
    name: sakura_network
    driver: bridge
