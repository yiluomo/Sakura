# ─────────────────────────────────────────────────────────
# Sakura docker-compose.yml
# 服务编排：mysql + backend + frontend
#
# 使用方式：
#   docker compose up -d          # 启动全部服务
#   docker compose down           # 停止并移除容器
#   docker compose logs -f        # 查看实时日志
#   docker compose logs backend   # 只看后端日志
# ─────────────────────────────────────────────────────────

services:

  # ── MySQL 数据库 ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sakura_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: YaeSakura
      MYSQL_DATABASE: sakura_db
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql        # 持久化数据库数据
    ports:
      - "3306:3306"                      # 可选，暴露到宿主机（方便本地 MySQL 客户端连接）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYaeSakura"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sakura_net


  # ── FastAPI 后端 ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend
    restart: unless-stopped
    environment:
      # 数据库连接（指向 mysql 服务名，而非 localhost）
      DATABASE_URL: "mysql+aiomysql://root:YaeSakura@mysql:3306/sakura_db"
      # 记忆文件存储路径（容器内挂载点）
      MEMORY_STORE_DIR: "/memory_store"
      # ── GPT-SoVITS TTS 配置（可按需覆盖，留空则用 config.py 默认值）──
      # GPT_SOVITS_BASE_URL: "http://host.docker.internal:9880"  # Docker 内访问宿主机 TTS 服务
      # GPT_SOVITS_REF_AUDIO_PATH: ""   # 参考音频绝对路径（宿主机路径，需挂载或网络共享）
      # GPT_SOVITS_PROMPT_TEXT: ""      # 参考音频对应台词
      # GPT_SOVITS_PROMPT_LANG: "zh"    # 参考音频语言
      # GPT_SOVITS_TEXT_LANG: "zh"      # 合成文本语言
      # GPT_SOVITS_SPEED_FACTOR: "1.0"  # 语速倍率（0.5~2.0）
      # GPT_SOVITS_MEDIA_TYPE: "wav"    # 输出格式：wav / ogg / aac / raw
      # GPT_SOVITS_TOP_K: "15"          # 采样 top-k
      # GPT_SOVITS_TOP_P: "1.0"         # 采样 top-p
      # GPT_SOVITS_TEMPERATURE: "1.0"   # 采样温度
      # GPT_SOVITS_SEED: "-1"           # 随机种子（-1=随机，固定值=可复现）
      # GPT_SOVITS_BATCH_SIZE: "1"      # 批处理大小
      # GPT_SOVITS_SAMPLE_STEPS: "32"   # V4 模型采样步数（越高越慢但质量更好）
      # GPT_SOVITS_GPT_WEIGHTS: ""      # GPT 模型权重路径（.ckpt），留空用服务默认
      # GPT_SOVITS_SOVITS_WEIGHTS: ""   # SoVITS 模型权重路径（.pth），留空用服务默认
    volumes:
      - memory_store:/memory_store       # 长期记忆 .md 文件持久化
      - ./backend/src/logs:/app/logs     # 日志持久化（确保宿主机目录存在）
    ports:
      - "8000:8000"                      # 可选，暴露给宿主机直接调试
    depends_on:
      mysql:
        condition: service_healthy       # 等 MySQL 健康检查通过才启动
    networks:
      - sakura_net


  # ── Vue3 前端 + Nginx ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakura_frontend
    restart: unless-stopped
    ports:
      - "80:80"                          # 对外暴露，访问 http://localhost
    depends_on:
      - backend
    networks:
      - sakura_net


# ── 持久化卷 ─────────────────────────────────────────────
volumes:
  mysql_data:
    name: sakura_mysql_data              # 数据库数据，不随 compose down 删除
  memory_store:
    name: sakura_memory_store            # 长期记忆文件，不随 compose down 删除


# ── 内部网络 ─────────────────────────────────────────────
networks:
  sakura_net:
    name: sakura_network
    driver: bridge
