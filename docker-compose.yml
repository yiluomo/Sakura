# ─────────────────────────────────────────────────────────
# Sakura docker-compose.yml
# 服务编排：backend + frontend (连接本地数据库)
#
# 使用方式：
#   docker compose up -d          # 启动全部服务
#   docker compose down           # 停止并移除容器
#   docker compose logs -f        # 查看实时日志
#   docker compose logs backend   # 只看后端日志
# ─────────────────────────────────────────────────────────

services:

  # ── FastAPI 后端 ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakura_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+aiomysql://root:YaeSakura@host.docker.internal:3306/sakura_db"
      MEMORY_STORE_DIR: "/memory_store"
      VECTOR_STORE_DIR: "/memory_store/vectors"
    volumes:
      - memory_store:/memory_store
      - ./backend/src/logs:/app/logs
    ports:
      - "0.0.0.0:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sakura_net


  # ── Vue3 前端 + Nginx ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sakura_frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    depends_on:
      - backend
    networks:
      - sakura_net


# ── 持久化卷 ─────────────────────────────────────────────
volumes:
  memory_store:
    name: sakura_memory_store


# ── 内部网络 ─────────────────────────────────────────────
networks:
  sakura_net:
    name: sakura_network
    driver: bridge
